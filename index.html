<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初めてのクリッカーゲーム</title>

    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png">

    <link rel="manifest" href="manifest.json">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>スコア: <span id="score">0</span></h1>
        <button id="click-btn">ここをクリック！</button>

        <hr style="margin: 30px 0;">

        <div class="shop">
            <h3>ショップ</h3>

            <p>マウスクリック強化: <span id="click-upgrade-count">0</span> 段階 (1クリック + <span id="current-click-power">1</span>)</p>
            <button id="buy-click-upgrade-btn" class="shop-btn">マウスを強化 (コスト: <span id="click-upgrade-cost">50</span>)</button>

            <hr style="margin: 15px 0; border: 0; border-top: 1px dashed #ccc;">

            <p>自動クリック装置: <span id="auto-count">0</span> 台 (毎秒+1)</p>
            <button id="buy-auto-btn" class="shop-btn">装置を買う (コスト: <span id="auto-cost">10</span>)</button>

            <p style="margin-top: 15px;">自動工場: <span id="factory-count">0</span> 基 (毎秒+10)</p>
            <button id="buy-factory-btn" class="shop-btn">工場を買う (コスト: <span id="factory-cost">100</span>)</button>
        </div>

        <hr style="margin: 30px 0;">

        <div class="settings">
            <button id="reset-btn">データをリセットする</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
