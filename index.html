<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>初めてのクリッカーゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>スコア: <span id="score">0</span></h1>
        <button id="click-btn">ここをクリック！</button>

        <hr style="margin: 30px 0;">

        <div class="shop">
            <h3>ショップ</h3>
            <p>自動クリック装置: <span id="auto-count">0</span> 台</p>
            <button id="buy-auto-btn">装置を買う (コスト: <span id="auto-cost">10</span>)</button>
        </div>

        <hr style="margin: 30px 0;">

        <div class="settings">
            <button id="reset-btn">データをリセットする</button>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
